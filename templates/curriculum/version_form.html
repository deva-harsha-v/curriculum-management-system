{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
{{ action }} Curriculum Version
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header">
            <h3>{{ action }} Curriculum Version</h3>
        </div>

        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                {{ form|crispy }}

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        Save
                    </button>

                    <a href="{% url 'curriculum:version_list' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
